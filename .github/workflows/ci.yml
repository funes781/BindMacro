name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  build-exe:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller keyboard mouse
      - run: pyinstaller --onefile --windowed main.py --name BindMacro
      - uses: actions/upload-artifact@v4
        with:
          name: BindMacro-exe
          path: dist/*.exe
